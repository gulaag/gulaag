<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Digvijay Singh — AI Engineer</title>
  <desc id="d">Agentic systems, production RAG and LLM evaluation. Animated diagram of a reason, act, observe, cite agent loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="20"/></clipPath>
    <path id="loop" d="M1010,80 A130,130 0 1,1 1009.9,80 Z"/>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .fade{}
      .d1{animation-delay:.1s}.d2{animation-delay:.45s}.d3{animation-delay:.8s}.d4{animation-delay:1.15s}.d5{animation-delay:1.5s}
      @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      .ring{stroke-dasharray:6 10;animation:spin 18s linear infinite;transform-origin:1010px 210px}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:1010px 210px}
      @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
      .node rect{fill:#111827;stroke:#374151;stroke-width:1.5}
      .node text{fill:#9CA3AF}
      .node{animation:lit 8s linear infinite}
      .n1{animation-delay:0s}.n2{animation-delay:2s}.n3{animation-delay:4s}.n4{animation-delay:6s}
      @keyframes lit{0%,22%{filter:drop-shadow(0 0 10px #22D3EE)}25%,100%{filter:none}}
      .node .hl{opacity:0;animation:hl 8s linear infinite}
      .n1 .hl{animation-delay:0s}.n2 .hl{animation-delay:2s}.n3 .hl{animation-delay:4s}.n4 .hl{animation-delay:6s}
      @keyframes hl{0%,22%{opacity:1}25%,100%{opacity:0}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)" opacity="0.55"/>
    <circle cx="1010" cy="210" r="260" fill="url(#glowV)"/>
    <circle cx="160" cy="40" r="260" fill="url(#glowC)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="20" fill="none" stroke="#1F2937"/>

  <!-- Left: identity -->
  <g class="fade d1">
    <text x="64" y="92" class="mono" font-size="17" fill="#22D3EE">&gt;&gt;&gt; agent.run("who is gulaag?")<tspan class="cursor" fill="#E5E7EB">▍</tspan></text>
  </g>
  <g class="fade d2">
    <text x="62" y="168" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-1.5">Digvijay Singh</text>
  </g>
  <g class="fade d3">
    <text x="64" y="214" class="sans" font-size="25" font-weight="700" fill="url(#accent)">AI Engineer · Agentic Systems · Production RAG</text>
  </g>
  <g class="fade d4">
    <text x="64" y="256" class="sans" font-size="18" fill="#9CA3AF">I build LLM agents that reason like analysts and cite like auditors,</text>
    <text x="64" y="282" class="sans" font-size="18" fill="#9CA3AF">and the backends, pipelines and evals that keep them honest in production.</text>
  </g>
  <g class="fade d5 sans" font-size="14" font-weight="600">
    <rect x="64" y="318" width="236" height="34" rx="17" fill="#1E1B4B" stroke="#4C1D95"/>
    <text x="182" y="340" text-anchor="middle" fill="#C4B5FD">◆ Databricks GenAI Engineer</text>
    <rect x="312" y="318" width="250" height="34" rx="17" fill="#082F49" stroke="#0E7490"/>
    <text x="437" y="340" text-anchor="middle" fill="#67E8F9">◆ Databricks Data Engineer Pro</text>
    <rect x="574" y="318" width="128" height="34" rx="17" fill="#052E16" stroke="#15803D"/>
    <text x="638" y="340" text-anchor="middle" fill="#86EFAC">IIIT Delhi · CS</text>
  </g>

  <!-- Right: agent loop -->
  <circle cx="1010" cy="210" r="130" fill="none" stroke="#4B5563" stroke-width="1.5" class="ring"/>
  <circle cx="1010" cy="210" r="96" fill="none" stroke="#1F2937" stroke-width="1"/>
  <circle r="6" fill="#22D3EE">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#loop"/></animateMotion>
  </circle>
  <circle r="12" fill="#22D3EE" opacity="0.25">
    <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion>
  </circle>

  <g class="pulse">
    <circle cx="1010" cy="210" r="50" fill="url(#core)"/>
    <circle cx="1010" cy="210" r="50" fill="none" stroke="#DDD6FE" stroke-opacity="0.5"/>
    <text x="1010" y="206" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#F5F3FF">LLM</text>
    <text x="1010" y="225" text-anchor="middle" class="mono" font-size="11" fill="#EDE9FE">harness</text>
  </g>

  <g class="node n1 mono" font-size="13" font-weight="700">
    <rect x="955" y="62" width="110" height="36" rx="10"/>
    <rect class="hl" x="955" y="62" width="110" height="36" rx="10" fill="#083344" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="1010" y="85" text-anchor="middle">① REASON</text>
    <text class="hl" x="1010" y="85" text-anchor="middle" fill="#A5F3FC">① REASON</text>
  </g>
  <g class="node n2 mono" font-size="13" font-weight="700">
    <rect x="1085" y="192" width="110" height="36" rx="10"/>
    <rect class="hl" x="1085" y="192" width="110" height="36" rx="10" fill="#083344" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="1140" y="215" text-anchor="middle">② ACT</text>
    <text class="hl" x="1140" y="215" text-anchor="middle" fill="#A5F3FC">② ACT</text>
  </g>
  <g class="node n3 mono" font-size="13" font-weight="700">
    <rect x="955" y="322" width="110" height="36" rx="10"/>
    <rect class="hl" x="955" y="322" width="110" height="36" rx="10" fill="#083344" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="1010" y="345" text-anchor="middle">③ OBSERVE</text>
    <text class="hl" x="1010" y="345" text-anchor="middle" fill="#A5F3FC">③ OBSERVE</text>
  </g>
  <g class="node n4 mono" font-size="13" font-weight="700">
    <rect x="825" y="192" width="110" height="36" rx="10"/>
    <rect class="hl" x="825" y="192" width="110" height="36" rx="10" fill="#052E16" stroke="#34D399" stroke-width="1.5"/>
    <text x="880" y="215" text-anchor="middle">④ CITE</text>
    <text class="hl" x="880" y="215" text-anchor="middle" fill="#A7F3D0">④ CITE</text>
  </g>

  <g class="mono" font-size="11" fill="#6B7280">
    <text x="1080" y="128">tool_call()</text>
    <text x="1078" y="300">evidence</text>
    <text x="852" y="300">[Source]</text>
    <text x="862" y="128">plan</text>
  </g>
</svg>
