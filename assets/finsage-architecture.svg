<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">FinSage architecture</title>
  <desc id="d">A question enters a bounded agent harness. The harness routes numeric questions to metric tools backed by audited Gold Delta tables and narrative questions to metadata-filtered vector search over BGE-large chunks. A citation enforcer checks the answer before it is returned. Underneath, a Bronze, Silver, Gold Medallion pipeline on Databricks feeds both paths. MLflow tracing and a 100-question evaluation harness gate every deploy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .box{fill:#111827;stroke:#374151;stroke-width:1.2}
      .wire{fill:none;stroke:#374151;stroke-width:1.6}
      .flow{fill:none;stroke-width:2.4;stroke-dasharray:8 14;animation:flow 1.4s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-22}}
      .h{font-weight:700;fill:#F3F4F6}
      .s{fill:#9CA3AF}
    </style>
  </defs>

  <rect width="1280" height="560" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="559" rx="20" fill="none" stroke="#1F2937"/>
  <text x="48" y="52" class="mono" font-size="14" fill="#22D3EE" letter-spacing="2">HOW FINSAGE ANSWERS A QUESTION</text>

  <!-- Question -->
  <g class="sans">
    <rect class="box" x="48" y="98" width="230" height="96" rx="14"/>
    <text x="68" y="128" font-size="13" class="mono s">user</text>
    <text x="68" y="154" font-size="15" class="h">"What was NVDA's</text>
    <text x="68" y="176" font-size="15" class="h">FY2024 operating margin?"</text>
  </g>

  <!-- Harness -->
  <g class="sans">
    <rect x="340" y="78" width="330" height="200" rx="16" fill="url(#core)" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="364" y="110" font-size="18" class="h">Agent harness</text>
    <text x="364" y="132" font-size="13" class="mono" fill="#C4B5FD">mlflow.pyfunc · zero LangChain</text>
    <text x="364" y="164" font-size="14" fill="#E5E7EB">• ReAct loop: reason → act → observe</text>
    <text x="364" y="188" font-size="14" fill="#E5E7EB">• ≤ 5 iterations · 150 s budget · temp 0</text>
    <text x="364" y="212" font-size="14" fill="#E5E7EB">• validates tool args, owns the contract</text>
    <text x="364" y="236" font-size="14" fill="#E5E7EB">• refuses out-of-corpus / future periods</text>
    <text x="364" y="260" font-size="13" class="mono" fill="#A5B4FC">model: Claude Sonnet 4.6</text>
  </g>

  <!-- Tools -->
  <g class="sans">
    <rect class="box" x="742" y="78" width="250" height="118" rx="14" stroke="#0E7490"/>
    <text x="760" y="104" font-size="12" class="mono" fill="#67E8F9">NUMBERS</text>
    <text x="760" y="128" font-size="13.5" class="mono h">get_company_metrics</text>
    <text x="760" y="150" font-size="13.5" class="mono h">get_quarterly_metrics</text>
    <text x="760" y="172" font-size="13.5" class="mono h">get_filing_metadata</text>

    <rect class="box" x="742" y="214" width="250" height="88" rx="14" stroke="#7C3AED"/>
    <text x="760" y="240" font-size="12" class="mono" fill="#C4B5FD">NARRATIVE</text>
    <text x="760" y="264" font-size="13.5" class="mono h">search_filings</text>
    <text x="760" y="286" font-size="13" class="s">filter: ticker · year · section</text>
  </g>

  <!-- Stores -->
  <g class="sans">
    <rect class="box" x="1052" y="78" width="180" height="118" rx="14"/>
    <text x="1070" y="108" font-size="15" class="h">Gold Delta</text>
    <text x="1070" y="130" font-size="13" class="s">audited metrics</text>
    <text x="1070" y="150" font-size="13" class="s">annual + quarterly</text>
    <text x="1070" y="176" font-size="12" class="mono" fill="#86EFAC">in-memory cache</text>

    <rect class="box" x="1052" y="214" width="180" height="88" rx="14"/>
    <text x="1070" y="242" font-size="15" class="h">Vector Search</text>
    <text x="1070" y="264" font-size="13" class="s">45,136 chunks</text>
    <text x="1070" y="284" font-size="12" class="mono" fill="#C4B5FD">sim ≥ 0.4 gate</text>
  </g>

  <!-- Answer -->
  <g class="sans">
    <rect x="340" y="318" width="330" height="96" rx="14" fill="#052E16" stroke="#15803D"/>
    <text x="360" y="346" font-size="13" class="mono" fill="#86EFAC">citation enforcer ✓</text>
    <text x="360" y="372" font-size="15" class="h">"Operating margin was 54.1%…"</text>
    <text x="360" y="396" font-size="12.5" class="mono" fill="#A7F3D0">[Source: NVDA | FY2024 | metrics]</text>
  </g>

  <!-- Wires -->
  <path class="wire" d="M278 146 H336" marker-end="url(#ar)"/>
  <path class="flow" d="M278 146 H336" stroke="#22D3EE"/>
  <path class="wire" d="M670 137 H738" marker-end="url(#ar)"/>
  <path class="flow" d="M670 137 H738" stroke="#22D3EE"/>
  <path class="wire" d="M670 240 C700 240 710 258 738 258" marker-end="url(#ar)"/>
  <path class="flow" d="M670 240 C700 240 710 258 738 258" stroke="#A78BFA"/>
  <path class="wire" d="M992 137 H1048" marker-end="url(#ar)"/>
  <path class="wire" d="M992 258 H1048" marker-end="url(#ar)"/>
  <path class="wire" d="M505 278 V314" marker-end="url(#ar)"/>
  <path class="flow" d="M505 278 V314" stroke="#34D399"/>

  <!-- Bottom: substrate -->
  <g class="sans">
    <text x="742" y="346" font-size="12" class="mono" fill="#6B7280" letter-spacing="1.5">DATA SUBSTRATE · DATABRICKS</text>
    <rect class="box" x="742" y="360" width="140" height="54" rx="12" stroke="#92400E"/>
    <text x="812" y="384" text-anchor="middle" font-size="14" class="h">Bronze</text>
    <text x="812" y="403" text-anchor="middle" font-size="12" class="s">Auto Loader</text>
    <rect class="box" x="917" y="360" width="140" height="54" rx="12" stroke="#6B7280"/>
    <text x="987" y="384" text-anchor="middle" font-size="14" class="h">Silver</text>
    <text x="987" y="403" text-anchor="middle" font-size="12" class="s">sec-parser · XBRL</text>
    <rect class="box" x="1092" y="360" width="140" height="54" rx="12" stroke="#CA8A04"/>
    <text x="1162" y="384" text-anchor="middle" font-size="14" class="h">Gold</text>
    <text x="1162" y="403" text-anchor="middle" font-size="12" class="s">metrics · chunks</text>
  </g>
  <path class="wire" d="M882 387 H913" marker-end="url(#ar)"/>
  <path class="wire" d="M1057 387 H1088" marker-end="url(#ar)"/>
  <path class="wire" d="M1162 360 V306" marker-end="url(#ar)"/>
  <path class="flow" d="M1162 360 V306" stroke="#FBBF24"/>

  <!-- Ops band -->
  <g class="sans">
    <rect x="48" y="448" width="1184" height="76" rx="14" fill="#0B1220" stroke="#1F2937"/>
    <text x="72" y="478" font-size="12" class="mono" fill="#6B7280" letter-spacing="1.5">LLMOPS · EVERY VERSION IS GATED</text>
    <text x="72" y="504" font-size="14" fill="#D1D5DB">MLflow Tracing (RETRIEVER/TOOL spans)  →  5-question preflight  →  100-question eval, 8 scorers  →  UC Model Registry  →  Model Serving (scale-to-zero)</text>
  </g>
</svg>
